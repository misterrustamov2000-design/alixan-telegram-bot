services:
  - type: web
    name: alixan-fastfood-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "1215985999"
      - key: MINI_APP_URL
        value: "https://alixan-fast-food.netlify.app/"
      - key: MAPS_URL
        value: "https://maps.app.goo.gl/Fhy5qVkYocFi2C92A?g_st=atm"
